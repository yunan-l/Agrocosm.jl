name: Enzyme differentiability

on:
  push:
    branches:
      - main
    paths:
      - Project.toml
      - Manifest.toml
      - src/**
      - ext/**
      - test/ad/**
      - test/runtests_ad.jl
      - .github/workflows/AD.yml
  pull_request:
    paths:
      - Project.toml
      - Manifest.toml
      - src/**
      - ext/**
      - test/ad/**
      - test/runtests_ad.jl
      - .github/workflows/AD.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  enzyme:
    name: Julia 1.10 - Enzyme AD
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.10'
      - uses: julia-actions/julia-buildpkg@v1
      - name: Run Enzyme differentiability tests
        run: julia --project=. test/runtests_ad.jl
