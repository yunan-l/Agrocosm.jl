[paths]
input_directory = "/Users/linyunan/Desktop/Agrocosm/work/data/input_data"
hwsd_targets = "/absolute/path/to/hwsd_canonical.nc"
output_directory = "/absolute/path/to/global_wheat_output"

[management]
fertilizer = "yes"
manure = true
with_tillage = true

[run]
warmup_years = 10
diagnostic_cells = 10
# 0 runs every 2015 landfrac-selected cell; use a positive value only for smoke tests.
cell_limit = 0

[validation]
maximum_water_residual = 0.01
maximum_carbon_relative_residual = 0.0001
maximum_nitrogen_relative_residual = 0.0001
maximum_thermal_relative_residual = 0.0001
maximum_percolation_energy_residual = 5.0
