[paths]
input_directory = "/absolute/path/input_data"
hwsd_targets = "/absolute/path/input_data/soil/hwsd_canonical.nc"
output_directory = "/absolute/path/output/global_cfts_gpu_allocation_validation"

[climate]
temperature_file = "tas_gswp3-w5e5_obsclim_1901-2019.nc"
precipitation_file = "pr_gswp3-w5e5_obsclim_1901-2019.nc"
longwave_file = "lwnet_gswp3-w5e5_obsclim_1901-2019.nc"
shortwave_file = "rsds_gswp3-w5e5_obsclim_1901-2019.nc"
co2_file = "global_co2_ann_1700_2022.txt"

[management]
mode = "fixed"
fixed_year = 2015
fertilizer = "yes"
manure = true
with_tillage = true

[cfts]
cft_ids = "all"
water_systems = ["rainfed", "irrigated"]

# Calibration phase: each CFT × water-system batch starts from HWSD and writes
# batches/<name>/calibration/warmup_soil_pool_allocation.nc. It intentionally
# skips the 2015–2016 production run.
[run]
backend = "cuda"
device_id = 0
memory_safety_factor = 1.2
simulation_start_year = 2015
simulation_end_year = 2016
warmup_climate_start_year = 1901
warmup_climate_end_year = 1930
warmup_target_constrained = true
warmup_minimum_years = 150
warmup_maximum_years = 600
warmup_consecutive_years = 3
warmup_relative_tolerance = 0.01
warmup_pool_fraction_tolerance = 0.01
warmup_required_converged_fraction = 1.0
warmup_cache_climate = false
require_warmup_convergence = false
diagnostic_cells = 10
cell_limit = 0

# Validation phase: each batch reloads its own calibration allocation, performs
# a free warm-up, then runs 2015–2016 with native checkpoint/restart.
[allocation_validation]
# Free validation uses two to five complete 30-year climate cycles. Calibration
# above remains the longer target-constrained 150--600 year procedure.
warmup_minimum_years = 60
warmup_maximum_years = 150
warmup_consecutive_years = 3
warmup_relative_tolerance = 0.01
warmup_pool_fraction_tolerance = 0.01
warmup_required_converged_fraction = 1.0
warmup_cache_climate = false
require_warmup_convergence = false

[validation]
maximum_water_residual = 0.01
maximum_carbon_relative_residual = 0.0001
maximum_nitrogen_relative_residual = 0.0001
maximum_thermal_relative_residual = 0.0001
maximum_percolation_energy_residual = 5.0
